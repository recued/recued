<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Recued — sign-in</title>
    <!-- The OAuth callback page, served twice: by the owner's server at
         /webclient/oauth-callback.html (a PWA at localhost or the server's
         own https name takes its code there), and by app.recued.com at
         /oauth-callback. The logic is oauth-callback-relay.js below, with no
         inline script, so both hosts' CSP (script-src 'self') allows it; see
         src/connections/oauth-callback-relay.ts for what each host needs. -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        padding: 2rem;
        max-width: 32rem;
        margin: 0 auto;
        color: #1a1a1a;
      }
      h1 { font-size: 1.25rem; }
      p { line-height: 1.5; }
      .err { color: #b00020; }
      .ok { color: #006400; }
    </style>
  </head>
  <body>
    <h1 id="status">Completing sign-in…</h1>
    <p id="message">Handing the result back to Recued.</p>
    <p><small>This page hands the sign-in code to your own Recued server, and to nothing else.</small></p>
    <script src="./oauth-callback-relay.js"></script>
  </body>
</html>
