<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Recued</title>
    <!-- D-148 § A.4 — PWA install manifest. The webclient is the
         display + HID surface to the user's recued-server; an install
         lets Mary "add to home screen" so the next launch goes straight
         into the paired UX without the URL bar. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- D-174 — the canonical design tokens are the single source of truth in
         @recued/ui-shared (tokens.css). build.mjs copies it into build/ and we
         <link> it here (render-blocking → no FOUC); bootstrapReceptionRoute then
         injects PRIMITIVE_STYLES on mount. Only the boot-splash styles below are
         shell-local. -->
    <link rel="stylesheet" href="./tokens.css" />
    <!-- Pre-bundle shell behaviour: theme-before-paint, splash reveal,
         service-worker registration, and the bundle-failure fallback.
         ⛔ EXTERNAL, NOT INLINE, and deliberately so — both surfaces that serve
         this shell send `script-src 'self'`, which blocked every inline block
         this file replaced (including the fallback that is supposed to rescue a
         failed bundle load). See boot-shell.js's header. Render-blocking in
         <head> on purpose: the theme must land before first paint and the error
         listener must exist before the module tag below is parsed. -->
    <script src="./boot-shell.js"></script>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); }
      body { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
      #webclient-root { min-height: 100vh; }
      .webclient-boot-splash {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; gap: 12px; color: var(--fg-muted); font-size: 13px;
      }
      /* A fast paired refresh should move straight into the shell without a
         one-frame Loading flash. The inline timer removes this marker; the
         animation is a no-script fallback so slow/error boots stay visible. */
      .webclient-boot-splash[data-recued-boot-pending] {
        visibility: hidden;
        animation: recued-boot-splash-reveal 0s linear 160ms forwards;
      }
      .webclient-boot-splash-brand { font-size: 18px; font-weight: 700; color: var(--brand); }
      @keyframes recued-boot-splash-reveal { to { visibility: visible; } }
    </style>
  </head>
  <body>
    <!-- Mount root for bootstrapWebclient({ root: … }). The boot splash
         below is replaced by the first mountReceptionRoute() pass; if
         the bundle fails to load (404 / parse error), the inline
         fallback script below upgrades the splash to a visible error
         so the user isn't stranded on "Loading…" indefinitely. -->
    <div id="webclient-root">
      <div class="webclient-boot-splash" id="webclient-boot-splash" data-recued-boot-pending>
        <div class="webclient-boot-splash-brand">Recued</div>
        <div id="webclient-boot-splash-message">Loading…</div>
      </div>
    </div>
    <!-- Main entry. `id` is load-bearing: boot-shell.js filters its
         capture-phase `error` listener on it, which is what upgrades the splash
         to an actionable message when this fails to load. That used to be an
         `onerror=` attribute here, which `script-src 'self'` blocked — so the
         one path that exists to avoid stranding the user on "Loading…" was
         itself the thing that never ran. -->
    <script id="webclient-main-script" type="module" src="./webclient-main.js"></script>
  </body>
</html>
