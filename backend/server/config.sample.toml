# recued-server — sample configuration (Phase E, D-107).
#
# Copy this file to the config path below and uncomment the settings
# you need. Every runtime key has a schema-backed default; this
# sample documents common overrides — it does NOT duplicate the
# full schema.
#
# The server reads ONE config file, the first of:
#   --config <path>
#   $RECUED_CONFIG
#   the platform default:
#     $XDG_CONFIG_HOME/recued/config.toml, else ~/.config/recued/config.toml  (Linux)
#     ~/Library/Application Support/Recued/config.toml  (macOS)
#     %APPDATA%\Recued\config.toml                      (Windows)
#
# The server watches the file for changes when `lifecycle.watch_config
# = true`; otherwise SIGHUP triggers a reload. See D-105.
#
# Per D-111: TOML is for operator concerns only (ports, paths, quotas,
# logging, scheduler floors). Collection instances — mail accounts,
# file sources, webhook endpoints, calendar subscriptions — are
# DB-only. Enroll them from the web app, or with the `collection.*`
# rpc methods (for example `collection.mail.enrollImap` or
# `collection.file.enroll`).

# ─── Environment, not config ────────────────────────────────────
#
# One setting deliberately lives ONLY in the environment, never in
# this file: `RECUED_IDENTITY_PASSPHRASE`, or
# `RECUED_IDENTITY_PASSPHRASE_FILE` naming a file that holds it.
#
# The server unwraps its own vault key from a key file in the data
# directory at every boot. That file is sealed by whichever factor
# the host offers on the FIRST boot that creates it:
#
#   1. RECUED_IDENTITY_PASSPHRASE, if set — outranks everything below
#   2. a platform secret store (macOS login keychain, Windows DPAPI,
#      the Linux Secret Service, systemd-creds), whose secret lives
#      outside the data directory
#   3. nothing — the key file sits readable beside the database
#
# ⚠ Rung 2 declines inside containers (a host credential key is
# either ephemeral or lives in the data volume), so a containerised
# server REFUSES its first boot without a passphrase rather than
# store the key file unsealed. Give it one as a secret file with
# RECUED_IDENTITY_PASSPHRASE_FILE. Elsewhere, unsealed still
# encrypts the realm; what it stops defending is a copy of the WHOLE
# data directory, which then carries the key too.
#
# ⚠ The server reads the passphrase only from those two variables,
# never from this file. Use your service manager's secret mechanism —
# systemd `EnvironmentFile=`, a compose `env_file`, a secret manager.
#
# Changing the PASSPHRASE later is cheap: stop the server and run
# `recued rotate-passphrase`. Same realm, same identity, nothing
# re-pairs — then set the new value in the environment.
#
# Changing the FACTOR (passphrase <-> platform store <-> unsealed)
# is recorded when the key file is created and is PERMANENT for that
# realm. Before the first pair the key file is disposable and a
# change costs a fresh identity, never data; afterwards it means
# `recued recover-keyfile` with the 24-word recovery key, which
# mints a new server identity and re-pairs every device.
#
# The web app shows the current posture under Settings → Server →
# Key Health.

# ─── Bootstrap — changing any field here requires a restart ─────
[bootstrap]
# The HTTP port for everything the server serves: the web app's rpc
# channel (/ws), pairing, MCP over HTTP (/mcp) and the other
# endpoints. `--port`, `PORT` and `RECUED_BOOTSTRAP_BIND_PORT` win
# over it.
# bind_port = 7717

# Inbound webhooks (Slack, Telegram, vendor callbacks) — off by
# default; `true` turns the webhook paths on. Public delivery also
# needs "collection.webhook.public_reachable" = true under [runtime]
# below, an address the server is reached at (a name under
# Settings → Server → Hostnames, or RECUED_PUBLIC_BASE_URL), and
# /webhooks ticked Public under Settings → Server → Exposure.
# Webhooks are paths on the server's ports, not a port of their own.
# D-096: Recued Cloud does NOT relay webhooks.
# webhooks_enabled = false
#
# This was `webhook_port` until 2026-10-10: an on/off switch named like
# a port (0 off, any other number on; no port was ever opened). The old
# name still works, and the server says how it read it at start-up.

# Removed on 2026-10-09, because nothing read them: `data_path`,
# `log_path`, `bind_host` and `mcp_port`. A file that still sets one
# starts as before, and the server names it in a warning at start-up.
# What does each job:
#   data_path, log_path — the data folder is the folder that holds
#     the database, and the server log is written there too. Choose
#     it with `--db` or `DB_PATH` (the default is the platform's
#     standard place).
#   bind_host — "network.lan_bind_address" under [runtime] below.
#   mcp_port — MCP is served at /mcp on bind_port; `recued --mcp`
#     talks over stdio.


# ─── Runtime — live-editable via rpc / SIGHUP / file watch ──────
[runtime]
# The address the LAN listener binds; restart to apply. Empty (the
# default) detects your network and binds every interface, or
# 127.0.0.1 alone when it cannot tell which interface is the real
# one. "127.0.0.1" serves only this machine.
# "network.lan_bind_address" = "127.0.0.1"

# Accept inbound webhooks from the internet. Set it once this server
# is reachable from outside (a public hostname, or a tunnel you run),
# with webhooks_enabled = true above. A reload (SIGHUP) applies it; no
# restart needed. Starting the server with RECUED_PUBLIC_REACHABLE=true
# does the same. D-096.
# "collection.webhook.public_reachable" = false

# Storage quotas — per-surface overrides. Defaults in the schema
# cover typical single-user workloads.
# "vault.quota.total_bytes"               = 52428800     # 50 MB
# ⚠ audit.quota.bytes counts CHARACTERS of stored JSON, not bytes on disk.
#   Identical for ASCII; ~1.24x larger on disk for accented Latin or emoji and
#   ~2x for CJK. Deliberate — the default is calibrated against that count — but
#   size your disk for the content you store. Default is 5 GB, not the example.
# "audit.quota.bytes"                     = 104857600    # 100 MB
# "cache.max_bytes"                       = 209715200    # 200 MB

# Recued cloud API base URL (D-148). Production is
# `https://api.recued.com` (DDNS update, ACME issue-cert), and it is
# the default. Override only for staging / dev / test environments;
# trailing slashes are stripped by each adapter.
# "cloud.base_url" = "https://api.recued.com"
